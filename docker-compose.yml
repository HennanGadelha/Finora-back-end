services:
  postgres:
    image: postgres:16-alpine
    container_name: finora-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finora}
      POSTGRES_USER: ${POSTGRES_USER:-finora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finora}
    ports:
      - "5432:5432"
    volumes:
      - finora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finora-postgres-data: