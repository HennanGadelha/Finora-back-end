spring:
  application:
    name: finora
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finora}
    username: ${DB_USERNAME:finora}
    password: ${DB_PASSWORD:finora}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
security:
  password:
    bcrypt:
      strength: ${BCRYPT_STRENGTH:12}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT15M}
