spring:
  application:
    name: finora
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finora}
    username: ${DB_USERNAME:finora}
    password: ${DB_PASSWORD:finora}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
security:
  password:
    bcrypt:
      strength: ${BCRYPT_STRENGTH:12}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT15M}
finora:
  cors:
    enabled: false
  test-user:
    enabled: ${FINORA_TEST_USER_ENABLED:false}
    name: ${FINORA_TEST_USER_NAME:Usuario de Teste}
    email: ${FINORA_TEST_USER_EMAIL:usuario.teste@finora.local}
    password: ${FINORA_TEST_USER_PASSWORD:}
    birth-date: ${FINORA_TEST_USER_BIRTH_DATE:1990-01-01}
